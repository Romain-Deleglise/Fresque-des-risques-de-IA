name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  valider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Valider cartes.json (39 entrees, 0..38, une carte intro)
        run: node scripts/valider-cartes.mjs
      - name: Installer les dependances
        run: npm ci --no-audit --no-fund
      - name: Tests (regles, limites, ateliers, contacts, service de sessions)
        # `npm test` et non une liste partielle : les tests du service de
        # sessions (coherence, ecriture conditionnelle, idempotence) verrouillent
        # des pannes qui sont DEJA passees en production sans rien faire tomber.
        run: npm test
      - name: Le PDF du guide correspond-il toujours a la page ?
        # Le PDF est IMPRIME depuis la page (scripts/generer-guide-pdf.mjs).
        # Sans ce controle, il suffit de modifier la page et d'oublier de le
        # regenerer pour que les deux repartent chacun de leur cote, et c'est le
        # PDF, une fois telecharge, qui devient la reference par defaut.
        run: node scripts/generer-guide-pdf.mjs --verifier

      - name: Verifier l'absence de requete vers un domaine tiers dans le HTML
        run: |
          if grep -RniE 'https?://(fonts\.googleapis|fonts\.gstatic|cdn\.|ajax\.googleapis)' site/ ; then
            echo "❌ Requete vers un domaine tiers detectee (B3.4)."; exit 1
          fi
          echo "✅ Aucune requete tierce evidente."

  accessibilite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Installer axe + Playwright
        run: npm install --no-save @axe-core/playwright axe-core playwright
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
      - name: Servir le site
        run: |
          python3 -m http.server 8099 --directory site &
          for i in $(seq 1 20); do curl -sf http://localhost:8099/ >/dev/null && break; sleep 0.5; done
      - name: Audit d'accessibilite (WCAG 2.1 A/AA)
        run: BASE=http://localhost:8099 node scripts/audit-a11y.mjs

  charge:
    # Un atelier entier, neuf navigateurs, sur le vrai relais. Ce qui coute ici
    # croit avec le CARRE du nombre de personnes : ce que deux navigateurs ne
    # peuvent pas montrer, neuf le montrent. Voir scripts/verifier-charge.mjs.
    # Uniquement sur main : neuf Chromium sur un runner partage peuvent etre
    # lents, et une mesure de charge instable ne doit jamais bloquer une PR.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save playwright ws
      - run: npx playwright install --with-deps chromium
      - name: Epreuve de charge (1 animateur + 8 participants)
        run: node scripts/verifier-charge.mjs

  tableau:
    # Ce qui casse en silence sur ce projet ne casse pas les tests unitaires :
    # une action perdue de temps en temps, un curseur qui donne mal au coeur,
    # des liens invisibles au dezoom. Ce travail-la se verifie dans un vrai
    # navigateur, a deux, avec le vrai relais. Voir scripts/verifier-tableau.mjs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Installer Playwright et le relais
        run: npm install --no-save playwright-core playwright ws
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
      - name: Verifier le tableau en ligne (temps reel, curseurs, zoom, fleches, animations)
        run: node scripts/verifier-tableau.mjs
