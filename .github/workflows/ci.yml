name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  valider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Valider cartes.json (39 entrees, 0..38, une carte intro)
        run: node scripts/valider-cartes.mjs
      - name: Installer les dependances
        run: npm ci --no-audit --no-fund
      - name: Tests (regles, limites, ateliers, contacts, service de sessions)
        # `npm test` et non une liste partielle : les tests du service de
        # sessions (coherence, ecriture conditionnelle, idempotence) verrouillent
        # des pannes qui sont DEJA passees en production sans rien faire tomber.
        run: npm test
      - name: Le PDF du guide correspond-il toujours a la page ?
        # Le PDF est IMPRIME depuis la page (scripts/generer-guide-pdf.mjs).
        # Sans ce controle, il suffit de modifier la page et d'oublier de le
        # regenerer pour que les deux repartent chacun de leur cote, et c'est le
        # PDF, une fois telecharge, qui devient la reference par defaut.
        run: node scripts/generer-guide-pdf.mjs --verifier

      - name: Verifier l'absence de requete vers un domaine tiers dans le HTML
        run: |
          if grep -RniE 'https?://(fonts\.googleapis|fonts\.gstatic|cdn\.|ajax\.googleapis)' site/ ; then
            echo "❌ Requete vers un domaine tiers detectee (B3.4)."; exit 1
          fi
          echo "✅ Aucune requete tierce evidente."

  accessibilite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Installer axe + Playwright
        run: npm install --no-save @axe-core/playwright axe-core playwright
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
      - name: Servir le site
        run: |
          python3 -m http.server 8099 --directory site &
          for i in $(seq 1 20); do curl -sf http://localhost:8099/ >/dev/null && break; sleep 0.5; done
      - name: Audit d'accessibilite (WCAG 2.1 A/AA)
        run: BASE=http://localhost:8099 node scripts/audit-a11y.mjs

  geste:
    # Fidelite du geste relaye : retard, arrets, deformation du trace. Ce sont
    # des millisecondes, elles ne se voient dans aucun test unitaire, et elles
    # font toute la difference entre « on voit ce que fait l'autre » et « on le
    # voit avec du retard ». Voir scripts/verifier-geste.mjs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save playwright ws
      - run: npx playwright install --with-deps chromium
      - name: Lien correct
        run: node scripts/verifier-geste.mjs
      - name: Lien degrade (60 ms, 120 ms de gigue)
        run: RESEAU_BASE=60 RESEAU_GIGUE=120 node scripts/verifier-geste.mjs

  charge:
    # Un atelier entier, neuf navigateurs, sur le vrai relais. Ce qui coute ici
    # croit avec le CARRE du nombre de personnes : ce que deux navigateurs ne
    # peuvent pas montrer, neuf le montrent. Voir scripts/verifier-charge.mjs.
    # Uniquement sur main : neuf Chromium sur un runner partage peuvent etre
    # lents, et une mesure de charge instable ne doit jamais bloquer une PR.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save playwright ws
      - run: npx playwright install --with-deps chromium
      - name: Epreuve de charge (1 animateur + 8 participants)
        run: node scripts/verifier-charge.mjs

  tableau:
    # Ce qui casse en silence sur ce projet ne casse pas les tests unitaires :
    # une action perdue de temps en temps, un curseur qui donne mal au coeur,
    # des liens invisibles au dezoom. Ce travail-la se verifie dans un vrai
    # navigateur, a deux, avec le vrai relais. Voir scripts/verifier-tableau.mjs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Installer Playwright et le relais
        run: npm install --no-save playwright-core playwright ws
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
      - name: Verifier le tableau en ligne (temps reel, curseurs, zoom, fleches, animations)
        run: node scripts/verifier-tableau.mjs

  espace:
    # L'espace animateur·ices n'est pas public, donc personne ne le regarde
    # tomber. Ce banc verifie que la fresque de reference s'affiche seule, que
    # les onglets de l'espace tiennent d'une page a l'autre, et qu'ils ne
    # debordent pas sur le guide vu par un visiteur ordinaire.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-save playwright-core playwright
      - run: npx playwright install --with-deps chromium
      - name: Verifier l'espace animateur·ices
        run: node scripts/verifier-espace.mjs

      # Le parcours d'abonnement aux alertes : un participant a signale qu'il
      # semblait casse, et il l'etait. Le banc rejoue son geste exact.
      - name: Verifier le parcours des alertes
        run: node scripts/verifier-alertes.mjs

      # Le rythme vertical : un lecteur a signale que l'espace avant une
      # section n'etait pas celui d'avant la suivante. Le banc mesure les
      # ecarts reels dans le navigateur, sur toutes les pages et deux largeurs,
      # en servant la meme politique de securite qu'en production (sans quoi il
      # mesurerait une mise en page que personne ne voit).
      - name: Verifier le rythme vertical des pages
        run: node scripts/verifier-rythme.mjs

      # L'apres-inscription des alertes : confirmation, annonce, non-repetition,
      # desabonnement en un clic. Sur les vraies fonctions, pas sur un bouchon.
      - name: Verifier le parcours complet des alertes
        run: node scripts/verifier-parcours-alertes.cjs

      # La planche d'impression se construit depuis cartes.json : si une carte
      # perd son titre, son verso ou son image, on le sait ici et non chez
      # l'imprimeur. `--verifier` ne garde aucun fichier.
      # Pillow reduit les images avant impression : sans lui le PDF passe de
      # 5,7 Mo a 40 Mo, pour une illustration qui tient dans une carte A6.
      - name: Installer Pillow (reduction des images de la planche)
        run: python3 -m pip install --quiet Pillow
      - name: Verifier que la planche d'impression est generable
        run: node scripts/generer-planche-pdf.mjs --verifier

      # Les brouillons de cartes : un texte non relu ne doit pas fuiter, et
      # publier ne doit rien perdre du fichier d'origine.
      - name: Verifier les brouillons de cartes
        run: node scripts/verifier-brouillons.cjs

      # Le bloc d'edition ecrit dans un texte publie : il ne doit pas apparaitre
      # sans jeton, ni pre-remplir le texte d'origine quand un brouillon attend.
      - name: Verifier l'edition des cartes depuis le panneau
        run: node scripts/verifier-edition.mjs

      # Le mode edition de la fresque deplace des cartes et trace des liens dans
      # un plan destine a etre publie. Rien de tout cela ne se verifie sans
      # navigateur : ce sont des gestes, une mise a l'echelle et une couche SVG.
      - name: Verifier l'edition de la fresque de reference
        run: node scripts/verifier-fresque-edition.mjs

      # Les communes suggerees et choisies n'existent qu'apres une frappe :
      # l'audit axe-core, qui regarde les pages au repos, ne les voyait pas. Leur
      # contraste etait de 1,00 en theme sombre, c'est-a-dire invisible.
      - name: Verifier le contraste du formulaire d'alertes
        run: node scripts/verifier-contraste-alertes.mjs
