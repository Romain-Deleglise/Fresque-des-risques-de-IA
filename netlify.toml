# Configuration Netlify : Fresque des risques de l'IA
# Site 100 % statique, aucune etape de build. Le contenu publie est le dossier site/.

[build]
  publish = "site"
  command = ""
  functions = "netlify/functions"

# Fonctions serverless : newsletter CiviCRM (subscribe) et mesure d'audience
# sans cookie (collect / stats, stockage Netlify Blobs). Variables d'environnement :
#   - CIVICRM_BASE_URL, CIVICRM_API_KEY, CIVICRM_SITE_KEY,
#     CIVICRM_NEWSLETTER_GROUP_ID (défaut 72, liste Fresque),
#     CIVICRM_PAUSEIA_GROUP_ID (défaut 3, newsletter Pause IA)
#   - AUDIENCE_KEY (optionnel) : si défini, protège la lecture de /stats/ par cette clé.
[functions]
  node_bundler = "esbuild"

# Programmation d'ateliers + inscriptions (fonction ateliers) et envoi d'e-mails
# transactionnels (Resend). Variables d'environnement a definir dans Netlify :
#   - RESEND_API_KEY : cle API Resend (sans elle, les inscriptions marchent mais
#     aucun e-mail n'est envoye ; le code s'affiche a l'ecran).
#   - MAIL_FROM      : expediteur verifie, ex "Fresque des risques de l'IA <atelier@pauseia.fr>"
#   - MAIL_REPONSE   : (optionnel) Reply-To, ex contact@pauseia.fr
#   - RESEND_MAX_JOUR : (optionnel) plafond d'envois par jour (defaut 95), garde-fou
#     sous la limite du compte Resend. Au-dela, l'envoi est refuse proprement.
#   - RESEND_MAX_MOIS : (optionnel) plafond d'envois par mois (defaut 2500).
#   - RESEND_SEUIL_ALERTE : (optionnel) a partir de ce nombre d'envois dans la
#     journee, un mail d'alerte previent l'equipe une fois par jour (defaut 80).
#   - MAIL_ALERTE    : (optionnel) destinataire de l'alerte (defaut contact@pauseia.fr).
#   - VISIO_BASE     : (optionnel) domaine des salons visio generes automatiquement,
#     ex https://visio.pauseia.fr pour une instance auto-hebergee (defaut meet.jit.si).
#   - SITE_URL       : URL publique du site pour les liens des e-mails,
#     ex https://fresquedesrisquesdelia.org (defaut : ce domaine).
#   - ADMIN_TOKEN    : cle secrete de l'espace d'administration (/admin/). Sans
#     elle, l'espace admin est desactive (fonction admin -> 503). A definir avec
#     une valeur longue et aleatoire, connue de la seule equipe.
# Registre durable des contacts : store Blobs "fresque-contacts", alimente par la
# fonction ateliers a la programmation et a l'inscription, lu par la fonction admin
# (suivi + statistiques + export CSV + desinscription/effacement RGPD).
# Rappels : la fonction rappels s'execute une fois par jour (voir ci-dessous) et
# ecrit a l'animateur + participants (CC) pour les ateliers du lendemain.
[functions."rappels"]
  schedule = "0 8 * * *"

# Rappel imminent : toutes les 15 min, prévient ~1 h avant le début (e-mail
# court avec code + lien visio + bouton pour rejoindre).
[functions."rappel-imminent"]
  schedule = "*/15 * * * *"

# Suivi post-atelier : une fois par jour, remercie animateur + participants
# (en Cci) apres l'atelier et invite a devenir animateur a son tour.
[functions."suivi"]
  schedule = "0 10 * * *"

# SURVEILLANCE : toutes les 15 min, verifie que le service de sessions repond et
# que son ecriture conditionnelle est operante, et que le relais temps reel
# repond dans une version au moins aussi recente que celle attendue par le site.
# Un e-mail a la premiere panne, un au retablissement, rien entre les deux.
# Sur ce projet, ce qui casse ne fait rien tomber : sans ce controle, on
# l'apprend en atelier. Destinataire : MAIL_ALERTE (variable Netlify).
[functions."surveillance"]
  schedule = "*/15 * * * *"

# Deploy Previews : actifs par defaut pour chaque pull request (rien a ajouter).
# Chaque PR recoit une URL de previsualisation isolee.

# SEPARATION ANIMER / PARTICIPER. Le formulaire « programmer un atelier » vivait
# dans un onglet cache de la page Participer ; chaque public a maintenant sa
# page. Les e-mails DEJA ENVOYES contiennent l'ancienne adresse de gestion :
# on la redirige, en gardant le code. (Le fragment #vue-animer, lui, n'arrive
# jamais jusqu'au serveur : c'est le JavaScript qui le rattrape, voir
# site/assets/js/ateliers.js.)
[[redirects]]
  from = "/participer/"
  query = { gerer = ":code" }
  to = "/devenir-animateur/?gerer=:code#gerer"
  status = 301
  force = true

[[redirects]]
  from = "/en/request-a-workshop/"
  query = { gerer = ":code" }
  to = "/en/facilitate/?gerer=:code#gerer"
  status = 301
  force = true

# Ancienne URL de la page « Participer » renommee : redirection permanente.
[[redirects]]
  from = "/demander-un-atelier/*"
  to = "/participer/:splat"
  status = 301

# Le mode solo de la Fresque en ligne a ete retire (la fresque se joue en groupe).
# On redirige l'ancienne URL vers la page de presentation plutot qu'un 404.
[[redirects]]
  from = "/en-ligne/atelier/*"
  to = "/en-ligne/"
  status = 301

# Redirection du domaine .fr vers le domaine principal .org (301 permanent).
# Le .fr est un alias du site sur Netlify ; sans regle explicite, Netlify sert
# le contenu sur le .fr sans rediriger. On force http ET https, avec et sans www.
[[redirects]]
  from = "https://fresquedesrisquesdelia.fr/*"
  to = "https://fresquedesrisquesdelia.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://fresquedesrisquesdelia.fr/*"
  to = "https://fresquedesrisquesdelia.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.fresquedesrisquesdelia.fr/*"
  to = "https://fresquedesrisquesdelia.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.fresquedesrisquesdelia.fr/*"
  to = "https://fresquedesrisquesdelia.org/:splat"
  status = 301
  force = true

# En-tetes de securite (B9.4 du cahier des charges).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    # CSP : interdit scripts et polices tiers, aucune requete externe.
    # connect-src : 'self' (fonctions Netlify) + le relais WebSocket des curseurs
    # en direct (temps reel), auto-heberge sur le serveur de dev.
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self' wss://curseurs.pauseia.fr; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Cache avec revalidation. IMPORTANT : les fichiers gardent un nom stable
# (site.css, cartes.js...) sans empreinte de version, donc on NE met PAS
# "immutable" (sinon le navigateur garde une vieille version pendant un an).
# ETag + must-revalidate : le navigateur revalide a chaque fois (304 si inchange).
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Les polices et images changent rarement et peuvent etre mises en cache
# (leur nom encode deja la variante), mais sans "immutable" par prudence.
# Le tableau en ligne vit HORS de /assets : ses fichiers n'etaient couverts par
# aucune regle de cache et dependaient donc du defaut de la plateforme. C'est
# exactement le genre d'ecart qui fait cohabiter un JavaScript recent avec une
# feuille de style ancienne dans un navigateur, avec des symptomes
# incomprehensibles a distance. Meme regle que le reste du site : on revalide.
[[headers]]
  for = "/en-ligne/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
