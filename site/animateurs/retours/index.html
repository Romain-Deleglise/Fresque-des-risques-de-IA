<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Retours · Espace animateur·ices</title>
  <meta name="description" content="Espace réservé aux animateur·ices : fresque de référence et retours sur les cartes.">
  <!-- PAGE NON PUBLIQUE. Elle n'est ni dans la navigation, ni dans le plan du
       site, et robots.txt l'exclut : on la transmet par courriel aux
       animateur·ices, et le guide n'y renvoie qu'en toute fin de page. Un
       participant qui tomberait dessus avant un atelier se gâcherait la
       découverte, qui est tout l'intérêt de la fresque. -->
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" sizes="64x64" href="../../assets/img/social/favicon.png?v=3">
  <link rel="stylesheet" href="../../assets/css/fonts.css">
  <link rel="stylesheet" href="../../assets/css/site.css">
  <link rel="stylesheet" href="../animateurs.css">
</head>
<body data-racine="../../">
  <a class="skip" href="#contenu">Aller au contenu</a>

  <header class="entete">
    <div class="wrap">
      <a class="logo" href="../../"><svg class="mk" viewBox="0 0 64 64" aria-hidden="true"><rect x="6" y="10" width="52" height="44" rx="11" fill="#E8811C"/><g fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="26" y1="24" x2="37" y2="21"/><line x1="20" y1="29" x2="31" y2="37"/><line x1="43" y1="26" x2="33" y2="37"/></g><g fill="#ffffff"><rect x="13" y="19" width="13" height="10" rx="2"/><rect x="37" y="16" width="13" height="10" rx="2"/><rect x="25" y="37" width="14" height="10" rx="2"/></g></svg> La Fresque des risques de l'IA</a>
      <nav class="nav" aria-label="Espace animateur·ices">
        <a href="../../animateurs/">Fresque</a>
        <a href="../../guide/?espace=1">Guide</a>
        <a href="../../animateurs/antiseche/">Antisèche</a>
        <a href="../../animateurs/retours/" aria-current="page">Retours</a>
      </nav>
    </div>
  </header>

  <main id="contenu">
    <div class="page-tete">
      <div class="wrap">
        <h1>Un retour&nbsp;?</h1>
        <p class="page-sous">Sur une carte, sur l'atelier, sur le jeu&nbsp;: dites-nous ce qui a
        coincé, ce qui a bien marché, ce qui manque. Nous lisons tout.</p>
      </div>
    </div>

    <section class="section">
      <div class="wrap etroit">
        <!-- UN SEUL FORMULAIRE, ET PAS DE LISTE. Les retours deposes se
             relisent dans /admin/, avec les retours d'atelier et les
             temoignages : au meme endroit que le reste, plutot que sur une page
             que les animateur·ices ouvrent pour ecrire, pas pour moderer. -->
        <form id="form-retour" class="form-retour">
          <label for="g-sujet">Sujet</label>
          <span class="select-joli"><select id="g-sujet">
            <option value="atelier">L'atelier en général</option>
            <option value="jeu">Le jeu de cartes en général</option>
            <option value="deroule">Le déroulé et le minutage</option>
            <option value="reference">La fresque de référence</option>
            <option value="autre">Autre</option>
          </select></span>

          <label for="g-carte">Une carte en particulier&nbsp;? <span class="opt">(facultatif)</span></label>
          <span class="select-joli"><select id="g-carte">
            <option value="">Aucune carte en particulier</option>
          </select></span>

          <label for="g-texte">Votre retour</label>
          <textarea id="g-texte" rows="5" maxlength="2000" required
            placeholder="Ce qui a coincé, ce qui a bien marché, ce qui manque…"></textarea>

          <label for="g-nom">Votre prénom <span class="opt">(facultatif)</span></label>
          <input id="g-nom" type="text" maxlength="40" autocomplete="given-name">

          <label for="g-email">Votre e-mail <span class="opt">(facultatif, si vous voulez une réponse)</span></label>
          <input id="g-email" type="email" maxlength="120" autocomplete="email">

          <button type="submit" class="btn btn-1">Envoyer</button>
          <p class="etat" id="g-etat" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>


  <footer class="pied">
    <div class="pied-bas">
      <div class="wrap">
        <span>© Pause IA · Cartes sous licence CC BY-SA 4.0</span>
        <span><a href="mailto:contact@pauseia.fr">contact@pauseia.fr</a></span>
      </div>
    </div>
  </footer>

  <!-- Le calque des corrections publiees depuis l'espace animateur·ices. Charge
       AVANT le script qui lit les cartes : `defer` garde l'ordre du document. -->
  <script src="../../assets/js/calque-cartes.js" defer></script>
  <script src="retours.js" defer></script>
  <script src="../../assets/js/nav.js" defer></script>
</body>
</html>
